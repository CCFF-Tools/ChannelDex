<nav class="schedule-modes" aria-label="Schedule view"><a href="{% url 'schedule' %}?mode=day&date={{ selected_date|date:'Y-m-d' }}"{% if request.GET.mode == 'day' or not request.GET.mode %} aria-current="page"{% endif %}>Day</a><a href="{% url 'schedule' %}?mode=week&date={{ selected_date|date:'Y-m-d' }}"{% if request.GET.mode == 'week' %} aria-current="page"{% endif %}>Week</a><a href="{% url 'schedule' %}?mode=agenda&days={{ days|default:'7' }}"{% if request.GET.mode == 'agenda' %} aria-current="page"{% endif %}>Agenda</a><a href="{% url 'schedule' %}?mode=recurring&date={{ selected_date|date:'Y-m-d' }}&days={{ days|default:'7' }}"{% if request.GET.mode == 'recurring' %} aria-current="page"{% endif %}>Recurring times</a></nav>
