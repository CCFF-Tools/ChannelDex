[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pub-tv"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Django>=5.2,<5.3", "gunicorn>=23,<24", "whitenoise==6.9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pubtv*"]
exclude = ["packaging*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pubtv.config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 100
